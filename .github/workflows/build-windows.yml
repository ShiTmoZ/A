name: Build & Release Windows Client

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 Native Binary
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore AetherClient.sln

      - name: Publish Single-File Executable
        run: |
          dotnet publish AetherClient\AetherClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish

      - name: Download & Bundle External Network Engines
        shell: pwsh
        run: |
          Write-Host "[*] Downloading Aether Core v2.4.0..."
          Invoke-WebRequest -Uri "https://github.com/CluvexStudio/Aether/releases/download/v2.4.0/aether-windows-x86_64.zip" -OutFile "aether.zip"
          Expand-Archive -Path "aether.zip" -DestinationPath "aether_out" -Force
          Copy-Item "aether_out\aether.exe" ".\publish\aether.exe" -Force

          Write-Host "[*] Downloading Wintun Driver v0.14.1..."
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_out" -Force
          Copy-Item "wintun_out\wintun\bin\amd64\wintun.dll" ".\publish\wintun.dll" -Force

          Write-Host "[*] Downloading Tun2Socks Core..."
          Invoke-WebRequest -Uri "https://github.com/xjasonlyu/tun2socks/releases/latest/download/tun2socks-windows-amd64.zip" -OutFile "tun2socks.zip"
          Expand-Archive -Path "tun2socks.zip" -DestinationPath "tun2socks_out" -Force
          Copy-Item "tun2socks_out\tun2socks-windows-amd64.exe" ".\publish\tun2socks.exe" -Force

          if (Test-Path "AetherClient\aether-masque.toml") {
              Copy-Item "AetherClient\aether-masque.toml" ".\publish\aether-masque.toml" -Force
          }

          if (Test-Path "AetherClient\aether-masque-secondary.toml") {
              Copy-Item "AetherClient\aether-masque-secondary.toml" ".\publish\aether-masque-secondary.toml" -Force
          }

          if (Test-Path "AetherClient\clean_ips.txt") {
              Copy-Item "AetherClient\clean_ips.txt" ".\publish\clean_ips.txt" -Force
          }

          if (Test-Path "AetherClient\app.ico") {
              Copy-Item "AetherClient\app.ico" ".\publish\app.ico" -Force
          }

          if (Test-Path "AetherClient\assets") {
              Copy-Item "AetherClient\assets" ".\publish\assets" -Recurse -Force
          }

          Get-ChildItem -Path ".\publish"

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ".\publish\*" -DestinationPath ".\AetherClient-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherClient-Windows-x64
          path: .\AetherClient-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Cloudflare WARP (MASQUE Edition) ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            ### Cloudflare WARP (MASQUE Edition) — Elven Mana & Hearth Edition
            Zero-bloat, production-grade desktop client for Cloudflare MASQUE (RFC 9298) HTTP/2 censorship bypass on DPI-restricted networks (TCI / MCI / Irancell).

            #### What's New:
            - **Marcille Donato Aesthetic Profile**: Deep cloaked glass backdrop with teal mana glow (#22B8CF), hearth gold highlights (#FFD166), and responsive avatar telemetry HUD.
            - **Restored Telemetry Console & 1-Click Copy**: Full high-speed monospace event stream with one-click clipboard copy feedback ("Copied!") and log clear.
            - **Automatic Anycast Turbo Mesh**: Restored authentic 2,079+ edge parallel hunter (`--turbo`) for guaranteed DPI tunnel bypass in Iran without broken static IP locks.
            - **Dual Routing Architecture**:
              - *True TUN (Wintun)*: Kernel-level L3 adapter with automated DNS clamp to `1.1.1.1` via `netsh` preventing `10.10.34.34` DNS spoofing.
              - *System Proxy*: WinINET local proxy on `127.0.0.1:1820` with instant browser cache refresh.
            - **Zero-Orphan Process Lifecycle**: Native Windows Job Objects terminate child engines immediately upon window close.
          files: .\AetherClient-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
